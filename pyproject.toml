[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifelink"
version = "0.1.0"
description = "Autonomous Emergency Response Orchestration & Algorithmic Dispatch System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LifeLink Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "ortools>=9.9.0",
    "networkx>=3.2.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "websockets>=12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
